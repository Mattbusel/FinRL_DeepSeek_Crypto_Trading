[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "larsa-crypto-trading"
version = "0.1.0"
description = "LARSA: LLM-Augmented Regime-Switching Agent for BTC algorithmic trading"
authors = [
    { name = "Matthew C. Busel", email = "mattbusel@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["reinforcement-learning", "crypto", "trading", "llm", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "certifi>=2024.12.14",
    "charset-normalizer>=3.4.1",
    "empyrical>=0.5.5",
    "filelock>=3.16.1",
    "fsspec>=2024.12.0",
    "idna>=3.10",
    "jinja2>=3.1.5",
    "lxml>=5.3.0",
    "matplotlib>=3.10.1",
    "MarkupSafe>=2.1.5",
    "mpmath>=1.3.0",
    "networkx>=3.1",
    "numpy>=1.24.4",
    "openai>=1.0.0",
    "pandas>=2.0.3",
    "pandas-datareader>=0.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2024.2",
    "requests>=2.32.3",
    "scipy>=1.10.1",
    "six>=1.17.0",
    "sympy>=1.13.3",
    "torch>=2.4.1",
    "typing-extensions>=4.12.2",
    "tzdata>=2024.2",
    "urllib3>=2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
    "bandit>=1.8",
    "types-requests",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.25",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/mattbusel/FinRL_DeepSeek_Crypto_Trading"
Repository = "https://github.com/mattbusel/FinRL_DeepSeek_Crypto_Trading"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "output*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
